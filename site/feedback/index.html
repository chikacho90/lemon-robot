<!doctype html>
<!-- 레몬 로봇 '피드백 남기기'(로봇 메뉴)가 여는 곳. ?app=&code=&mac= 를 받아 같이 보낸다.
     보내면 우의 개인서버 lemonrobot.woo.moi/api 로 간다(lemon-robot feedback-server/). 보기는 lemonrobot.woo.moi(woo.moi 로그인, 우만). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레몬 로봇 피드백</title>
<link rel="icon" href="../favicon.png">
<style>
  :root { --bg: #FFFBEC; --ink: #23511F; --text: #3E4A33; --muted: #6F7862; --line: #EDE6CC; --lemon: #F5CE2E; --field: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14170F; --ink: #EEF3DF; --text: #C9CFBA; --muted: #959C85; --line: #2A2F21; --field: #1C2016; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
  img { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin-bottom: 20px; }
  h1 { margin: 0 0 8px; color: var(--ink); font-size: 30px; letter-spacing: -0.02em; }
  p { margin: 0; }
  form { margin-top: 28px; display: grid; gap: 14px; }
  label { font-size: 15px; font-weight: 600; color: var(--ink); }
  textarea, input { width: 100%; margin-top: 6px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); font: inherit; }
  textarea { min-height: 160px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  button { justify-self: start; padding: 14px 24px; border: 0; border-radius: 10px; background: var(--lemon); color: #23511F; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .meta { font-size: 14px; color: var(--muted); }
  /* 글상자 안에 그림이 같이 들어가는 입력칸(2026-11-27 우: Claude 입력창처럼) */
  .box { margin-top: 6px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--field); }
  .box:focus-within { outline: 2px solid var(--ink); outline-offset: 1px; }
  .box.over { border-color: var(--ink); border-style: dashed; }
  .box textarea { margin: 0; border: 0; border-radius: 12px; background: transparent; min-height: 140px; }
  .box textarea:focus { outline: none; }
  .shots { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 12px 0; }
  .shots:empty { display: none; }
  .shot { position: relative; }
  .shot img { width: 112px; height: 84px; object-fit: cover; image-rendering: auto; margin: 0; border-radius: 10px; border: 1px solid var(--line); }
  .shot button { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; padding: 0; border-radius: 50%; font-size: 13px; line-height: 20px; background: var(--ink); color: var(--bg); border: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 0 10px 10px; font-size: 13px; font-weight: 400; color: var(--muted); }
  .bar button { padding: 4px 12px; font-size: 14px; font-weight: 600; border-radius: 8px; background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
  .done { margin-top: 28px; padding: 20px; border: 1.5px dashed var(--line); border-radius: 10px; }
  a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="">
  <h1>레몬 로봇에게 한마디</h1>
  <p>불편한 점, 고장, 바라는 기능 무엇이든 좋아요.</p>
  <form id="f">
    <div><label for="text">하고 싶은 말</label>
      <div class="box" id="drop">
        <div class="shots" id="shots"></div>
        <textarea id="text" name="text" required maxlength="4000" placeholder="예: 허용 창이 안 떠요 / 펫으로 고양이도 있으면 좋겠어요"></textarea>
        <div class="bar"><button type="button" id="pick">+ 스크린샷</button><span>붙여넣기(⌘V)나 끌어다 놓기도 돼요</span></div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,image/heic" multiple hidden>
      </div>
    </div>
    <label>이름 <span class="meta">(선택, 답을 받고 싶으면)</span><input name="who" maxlength="80" autocomplete="name"></label>
    <button type="submit">보내기</button>
    <p class="meta" id="err" role="alert" style="color:#B4462B"></p>
    <p class="meta" id="ver"></p>
  </form>
  <div class="done" id="done" hidden><p><b>고마워요!</b> 잘 받았어요. 고쳐지면 레몬 로봇이 알아서 업데이트돼요.</p><p class="meta" style="margin-top:8px"><a href="/">레몬 로봇 페이지로</a></p></div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const info = { app: q.get('app') || '', code: q.get('code') || '', mac: q.get('mac') || '' };
  if (info.app) document.getElementById('ver').textContent = `앱 ${info.app} · 코드 ${info.code || '-'} · ${info.mac} 정보도 같이 보내요`;
  const f = document.getElementById('f');
  // 스크린샷: 붙여넣기·파일 고르기·끌어다 놓기. 보내기 전에 긴 변 1600px JPEG 로 줄인다
  const MAX = 10, shots = [], box = document.getElementById('shots'), file = document.getElementById('file'), drop = document.getElementById('drop');
  const err = m => document.getElementById('err').textContent = m;
  function shrink(blob) {
    return new Promise((ok, no) => {
      const url = URL.createObjectURL(blob), im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
      };
      im.onerror = () => { URL.revokeObjectURL(url); no(new Error('이 그림은 못 읽었어요. PNG나 JPG로 넣어 주세요')); };
      im.src = url;
    });
  }
  function draw() {
    box.innerHTML = '';
    shots.forEach((u, i) => {
      const d = document.createElement('div'); d.className = 'shot';
      const im = document.createElement('img'); im.src = u; im.alt = `스크린샷 ${i + 1}`;
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', '빼기');
      x.onclick = () => { shots.splice(i, 1); draw(); };
      d.append(im, x); box.append(d);
    });
  }
  async function add(list) {
    err('');
    for (const b of list) {
      if (!b.type.startsWith('image/')) continue;
      if (shots.length >= MAX) { err(`스크린샷은 ${MAX}장까지 넣을 수 있어요`); break; }
      try { shots.push(await shrink(b)); } catch (e) { err(e.message); }
    }
    draw();
  }
  document.getElementById('pick').onclick = () => file.click();
  file.onchange = () => { add([...file.files]); file.value = ''; };
  document.addEventListener('paste', e => {
    const imgs = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile());
    if (imgs.length) { e.preventDefault(); add(imgs); }
  });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); add([...e.dataTransfer.files]); });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const b = f.querySelector('button'); b.disabled = true; b.textContent = '보내는 중…';
    try {
      const r = await fetch('https://lemonrobot.woo.moi/api', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: f.text.value, name: f.who.value, images: shots, ...info }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.reason || '못 보냈어요. 잠시 뒤에 다시 해 주세요');
      f.hidden = true; document.getElementById('done').hidden = false;
    } catch (err) { b.disabled = false; b.textContent = '보내기'; document.getElementById('err').textContent = err.message; }
  });
</script>
</body>
</html>
