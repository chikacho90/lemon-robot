<!doctype html>
<!-- 레몬 로봇 '피드백 남기기'(로봇 메뉴)가 여는 곳. ?app=&code=&mac= 를 받아 같이 보낸다.
     보내면 우의 개인서버 lemonrobot.woo.moi/api 로 간다(lemon-robot feedback-server/). 보기는 lemonrobot.woo.moi(woo.moi 로그인, 우만). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레몬 로봇 피드백</title>
<link rel="icon" href="../favicon.png">
<style>
  :root { --bg: #FFFBEC; --ink: #23511F; --text: #3E4A33; --muted: #6F7862; --line: #EDE6CC; --lemon: #F5CE2E; --field: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14170F; --ink: #EEF3DF; --text: #C9CFBA; --muted: #959C85; --line: #2A2F21; --field: #1C2016; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
  img { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin-bottom: 20px; }
  h1 { margin: 0 0 8px; color: var(--ink); font-size: 30px; letter-spacing: -0.02em; }
  p { margin: 0; }
  form { margin-top: 28px; display: grid; gap: 14px; }
  label { font-size: 15px; font-weight: 600; color: var(--ink); }
  textarea, input { width: 100%; margin-top: 6px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); font: inherit; }
  textarea { min-height: 160px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  button { justify-self: start; padding: 14px 24px; border: 0; border-radius: 10px; background: var(--lemon); color: #23511F; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .meta { font-size: 14px; color: var(--muted); }
  .done { margin-top: 28px; padding: 20px; border: 1.5px dashed var(--line); border-radius: 10px; }
  a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="">
  <h1>레몬 로봇에게 한마디</h1>
  <p>불편한 점, 고장, 바라는 기능 무엇이든 좋아요. 만든 사람의 개인 서버로 가고, 만든 사람만 읽어요.</p>
  <form id="f">
    <label>하고 싶은 말<textarea name="text" required maxlength="4000" placeholder="예: 허용 창이 안 떠요 / 펫으로 고양이도 있으면 좋겠어요"></textarea></label>
    <label>이름 <span class="meta">(선택, 답을 받고 싶으면)</span><input name="who" maxlength="80" autocomplete="name"></label>
    <button type="submit">보내기</button>
    <p class="meta" id="err" role="alert" style="color:#B4462B"></p>
    <p class="meta" id="ver"></p>
  </form>
  <div class="done" id="done" hidden><p><b>고마워요!</b> 잘 받았어요. 고쳐지면 레몬 로봇이 알아서 업데이트돼요.</p><p class="meta" style="margin-top:8px"><a href="/">레몬 로봇 페이지로</a></p></div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const info = { app: q.get('app') || '', code: q.get('code') || '', mac: q.get('mac') || '' };
  if (info.app) document.getElementById('ver').textContent = `앱 ${info.app} · 코드 ${info.code || '-'} · ${info.mac} 정보도 같이 보내요`;
  const f = document.getElementById('f');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const b = f.querySelector('button'); b.disabled = true; b.textContent = '보내는 중…';
    try {
      const r = await fetch('https://lemonrobot.woo.moi/api', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: f.text.value, name: f.who.value, ...info }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.reason || '못 보냈어요. 잠시 뒤에 다시 해 주세요');
      f.hidden = true; document.getElementById('done').hidden = false;
    } catch (err) { b.disabled = false; b.textContent = '보내기'; document.getElementById('err').textContent = err.message; }
  });
</script>
</body>
</html>
