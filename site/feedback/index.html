<!doctype html>
<!-- 레몬 로봇 '피드백 남기기'(로봇 메뉴)가 여는 곳. ?app=&code=&mac= 를 받는다.
     받는 곳은 아래 TARGET 하나만 바꾸면 된다(앱 업데이트 없이). {app} {code} {mac} 은 값으로 바꿔 넣는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레몬 로봇 피드백</title>
<link rel="icon" href="../favicon.png">
<style>
  :root { --bg: #FFFBEC; --ink: #23511F; --text: #3E4A33; --muted: #6F7862; --line: #EDE6CC; --lemon: #F5CE2E; --lemon-soft: #FFF3C2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14170F; --ink: #EEF3DF; --text: #C9CFBA; --muted: #959C85; --line: #2A2F21; --lemon-soft: #2C2A14; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  main { max-width: 520px; padding: 48px 24px; text-align: center; }
  img { width: 96px; height: 96px; image-rendering: pixelated; margin: 0 auto 24px; display: block; }
  h1 { margin: 0 0 12px; color: var(--ink); font-size: 28px; letter-spacing: -0.02em; }
  p { margin: 0; }
  .meta { margin-top: 20px; font-size: 14px; color: var(--muted); }
  a.go { display: inline-block; margin-top: 28px; padding: 14px 22px; border-radius: 10px; background: var(--lemon); color: #23511F; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="">
  <h1>레몬 로봇에게 한마디</h1>
  <p id="msg">불편한 점, 고장, 바라는 기능 무엇이든 좋아요.</p>
  <a class="go" id="go" hidden>피드백 남기러 가기</a>
  <p class="meta" id="ver"></p>
</main>
<script>
  const TARGET = '';  // 예: 'https://docs.google.com/forms/d/e/…/viewform?usp=pp_url&entry.1={app}'
  const q = new URLSearchParams(location.search);
  const v = k => encodeURIComponent(q.get(k) || '');
  if (q.get('app')) document.getElementById('ver').textContent = `앱 ${q.get('app')} · 코드 ${q.get('code') || '-'} · ${q.get('mac') || ''}`;
  if (TARGET) {
    const url = TARGET.replace('{app}', v('app')).replace('{code}', v('code')).replace('{mac}', v('mac'));
    const a = document.getElementById('go'); a.href = url; a.hidden = false;
    location.replace(url);
  } else {
    document.getElementById('msg').textContent = '피드백 받는 곳을 준비하고 있어요. 그동안은 레몬 로봇을 알려 준 사람에게 직접 말해 주세요.';
  }
</script>
</body>
</html>
